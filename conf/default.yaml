app:
  name: "banking-ops-svc"
server:
  host: localhost
  port: 8080
logger:
  level: DEBUG
kafka:
  configMap:
    - group.id: banking-ops-svc
    - session.timeout.ms: 30_000
    - auto.offset.reset: latest
    - auto.commit.interval.ms: 1000
    - enable.auto.commit: true
    - enable.auto.offset.store: false
  topics:
    exampleEvents: banking_ops_events
  processingTimeoutMs: 60000
  bootstrapServers: localhost:9092
postgres:
  username: "" #Read from ENV_VARS
  password: "" #Read from ENV_VARS
  host: "" #Read from ENV_VARS
  port: 5432
  db: "" #Read from ENV_VARS
  sslMode: require
  migrationsDir: "/etc/banking-ops-svc/db/migrations"
tracing:
  collectorAddress: "" #Read from ENV_VARS
  disabled: "" #Read from ENV_VARS
