apiVersion: apps/v1
kind: Deployment
metadata:
  name: banking-ops-svc
  labels:
    app: banking-ops-svc
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  selector:
    matchLabels:
      app: banking-ops-svc
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: "100%"
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: banking-ops-svc
    spec:
      serviceAccountName: banking-ops-svc-service-account
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: banking-ops-svc
                topologyKey: kubernetes.io/hostname
      initContainers:
        - name: migratedb-up
          image: wahedtech/banking-ops-svc
          imagePullPolicy: IfNotPresent
          command: [ "/bin/app" ]
          args: [ "migratedb", "up" ]
          resources:
            requests:
              memory: "40Mi"
              cpu: "20m"
          envFrom:
            - configMapRef:
                name: banking-ops-svc-config
            - configMapRef:
                name: shared-env-var
          env:
            - name: POSTGRES_USERNAME
              valueFrom:
                secretKeyRef:
                  name: banking-ops-svc-secret
                  key: postgres_username
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: banking-ops-svc-secret
                  key: postgres_password
      containers:
        - name: banking-ops-svc
          image: wahedtech/banking-ops-svc
          imagePullPolicy: IfNotPresent
          resources:
            requests:
              memory: "100Mi"
              cpu: "50m"
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
          envFrom:
            - configMapRef:
                name: banking-ops-svc-config
            - configMapRef:
                name: shared-env-var
          env:
            - name: POSTGRES_USERNAME
              valueFrom:
                secretKeyRef:
                  name: banking-ops-svc-secret
                  key: postgres_username
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: banking-ops-svc-secret
                  key: postgres_password
      imagePullSecrets:
        - name: wahedtech-dockercloud-cred
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: banking-ops-svc-commands-watcher
  labels:
    app: banking-ops-svc-commands-watcher
spec:
  selector:
    matchLabels:
      app: banking-ops-svc-commands-watcher
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: "100%"
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: banking-ops-svc-commands-watcher
    spec:
      serviceAccountName: banking-ops-svc-service-account
      containers:
        - name: banking-ops-svc-commands-watcher
          image: wahedtech/banking-ops-svc
          imagePullPolicy: IfNotPresent
          command: [ "/bin/app" ]
          args: [ "commands-watcher" ]
          resources:
            requests:
              memory: "100Mi"
              cpu: "50m"
          envFrom:
            - configMapRef:
                name: banking-ops-svc-config
            - configMapRef:
                name: shared-env-var
      imagePullSecrets:
        - name: wahedtech-dockercloud-cred
