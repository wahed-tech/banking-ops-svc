apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: banking-ops-svc
  annotations:
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/group.name: k8s-userfacing-alb
    alb.ingress.kubernetes.io/ssl-redirect: '443'
    alb.ingress.kubernetes.io/actions.ssl-redirect: '{"Type": "redirect", "RedirectConfig": { "Protocol": "HTTPS", "Port": "443", "StatusCode": "HTTP_301"}}'
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}, {"HTTPS": 443}]'
    alb.ingress.kubernetes.io/certificate-arn: arn:aws:acm:eu-west-1:630728872373:certificate/9146e44c-9971-4618-b4cb-397dcfe42ad7
    alb.ingress.kubernetes.io/healthcheck-path: "/healthz"
    alb.ingress.kubernetes.io/healthcheck-port: "traffic-port"
    alb.ingress.kubernetes.io/healthcheck-protocol: "HTTP"
    alb.ingress.kubernetes.io/ssl-policy: "ELBSecurityPolicy-TLS13-1-3-2021-06"
spec:
  ingressClassName: alb
  rules:
    - host: banking-ops.irl.prod.wahed.tech
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: banking-ops-svc
                port:
                  number: 8080
