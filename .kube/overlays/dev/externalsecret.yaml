apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: banking-ops-svc-external-secret
  namespace: wahed
spec:
  refreshInterval: 24h # syncs after 24 hours
  secretStoreRef:
    name: aws-secret-store
    kind: SecretStore
  target:
    name: banking-ops-svc-secret # the k8s secret name
    creationPolicy: Owner
  data:
    - secretKey: postgres_username
      remoteRef:
        key: banking-ops-svc-postgres-dev # the aws secret name
        property: username
    - secretKey: postgres_password
      remoteRef:
        key: banking-ops-svc-postgres-dev # the aws secret name
        property: password
